name: 更新宽基 PE 10年分位数据

on:
  schedule:
    # UTC 1:30 = 北京时间 9:30（A股开盘前）
    - cron: '30 1 * * 1-5'
    # UTC 8:00 = 北京时间 16:00（A股/港股收盘后）
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests
      - name: 抓取数据
        run: python fetch_data.py
      - name: 提交更新
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新宽基PE分位数据 $(date -u +%Y-%m-%d)"
            git push
          fi
