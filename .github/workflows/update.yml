name: 更新宽基 PE 10年分位数据

on:
  schedule:
    # 工作日每小时一次（UTC 0:30~12:30 = 北京时间 8:30~20:30）
    # GitHub 免费版定时任务经常延迟甚至漏跑，用高频次对冲：
    # 只要任意一次成功，data.json 就是当天最新抓取结果
    - cron: '30 0-12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests
      - name: 抓取数据
        run: python fetch_data.py
      - name: 提交更新
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json global_cache.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新宽基PE分位数据 $(date -u +%Y-%m-%d\ %H:%M)"
            git pull --rebase origin main
            git push
          fi
